# Example for Nginx ALREADY installed on the Docker host.
# Include this file inside Nginx's http {} context (not inside another server {}).
# Replace terminal.example.com and the certificate/key paths before use.
# Keep your existing certificate issuance/renewal and unrelated virtual hosts.

map $http_upgrade $ergent_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name terminal.example.com;
    return 308 https://terminal.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name terminal.example.com;

    ssl_certificate     /etc/letsencrypt/live/terminal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terminal.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ergent_connection_upgrade;

        # Overwrite client-supplied forwarding headers. ErGent trusts X-Real-IP
        # only when the TCP peer is an explicitly configured --trusted-proxy IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
