name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, target: windows-x86_64, triple: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: windows-arm64, triple: aarch64-pc-windows-msvc }
          - { runner: ubuntu-22.04, target: linux-x86_64, triple: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: linux-arm64, triple: aarch64-unknown-linux-gnu }
          - { runner: macos-15-intel, target: macos-x86_64, triple: x86_64-apple-darwin }
          - { runner: macos-15, target: macos-arm64, triple: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.triple }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.17.1'
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-directories: target/package
      - name: Test Rust workspace on target machine
        run: cargo test --workspace --locked --target ${{ matrix.triple }}
      - name: Build and package
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=(--expect-version "$GITHUB_REF_NAME")
          fi
          python scripts/package.py --target "$PACKAGE_TARGET" "${args[@]}"
      - name: Verify archive contents and hashes
        run: python scripts/verify-release.py release
      - uses: actions/upload-artifact@v4
        with:
          name: ergent-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  assemble:
    needs: package
    concurrency:
      group: release-assets-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ergent-*
          path: release
          merge-multiple: true
      - name: Require all six packages and generate checksums
        run: python3 scripts/verify-release.py release --require-all
      - uses: actions/upload-artifact@v4
        with:
          name: ergent-all-platforms
          path: release/*
          if-no-files-found: error
      - name: Create draft or upload missing verified release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 scripts/publish-release.py release \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --commit "$(git rev-parse HEAD)"
