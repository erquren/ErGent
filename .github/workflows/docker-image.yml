name: Docker image (manual)

# Deliberately no push/tag/release trigger. Does not modify GitHub Releases.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Explicitly authorize publishing a new GHCR server image (sha tag only)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/docker-validation.yml

  publish:
    needs: validate
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Select immutable source tag
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "tag=ghcr.io/${repository}-server:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
