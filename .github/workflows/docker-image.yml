name: Docker image (manual)

# Deliberately no push/tag/release trigger. Does not modify GitHub Releases.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish linux/amd64 and linux/arm64 images to Docker Hub erquren/ergent'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/docker-validation.yml

  publish:
    needs: validate
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    environment: dockerhub
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check project versions and select Docker Hub tags
        id: image
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version']
          web_version = json.loads(Path('apps/web/package.json').read_text(encoding='utf-8'))['version']
          if web_version != version:
              raise SystemExit(f'Web version {web_version} does not match Rust version {version}')
          tags = [f'docker.io/erquren/ergent:sha-{os.environ["GITHUB_SHA"]}']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              expected = f'v{version}'
              if os.environ['GITHUB_REF_NAME'] != expected:
                  raise SystemExit(f'Expected version tag {expected}')
              tags.append(f'docker.io/erquren/ergent:{version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('tags<<IMAGE_TAGS\n' + '\n'.join(tags) + '\nIMAGE_TAGS\n')
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push both architectures
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record published image
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          {
            echo '### Docker Hub: erquren/ergent'
            echo 'Platforms: linux/amd64, linux/arm64'
            echo '```text'
            printf '%s\n' "$IMAGE_TAGS"
            printf 'docker.io/erquren/ergent@%s\n' "$IMAGE_DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
