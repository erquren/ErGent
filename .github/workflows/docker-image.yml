name: Docker image (manual)

# Deliberately no push/tag/release trigger. Does not modify GitHub Releases.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish linux/amd64 and linux/arm64 images to Docker Hub erquren/ergent'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

# Serialize publication so two runs cannot race to replace the same version tag.
concurrency:
  group: docker-image-manual
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/docker-validation.yml

  prepare:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.image.outputs.tags }}
      version: ${{ steps.image.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check project versions and select Docker Hub version tag
        id: image
        run: python scripts/docker_tags.py

  build:
    name: Publish native Linux ${{ matrix.architecture }}
    needs: [validate, prepare]
    if: ${{ inputs.publish }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: dockerhub
    steps:
      - uses: actions/checkout@v4
      - name: Confirm native runner architecture
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          case "$ARCHITECTURE:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo 'Runner architecture does not match image target' >&2; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build native image and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          outputs: type=image,name=docker.io/erquren/ergent,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digests/$ARCHITECTURE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/${{ matrix.architecture }}.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    name: Publish version manifest
    needs: [prepare, build]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    environment: dockerhub
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Merge native images and publish version tag
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.tags }}
        shell: bash
        run: |
          amd64_digest=$(cat "$RUNNER_TEMP/digests/amd64.txt")
          arm64_digest=$(cat "$RUNNER_TEMP/digests/arm64.txt")
          [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          images=("docker.io/erquren/ergent@$amd64_digest" "docker.io/erquren/ergent@$arm64_digest")
          # Check the assembled platforms before updating the public version tag.
          docker buildx imagetools create --dry-run "${images[@]}" > "$RUNNER_TEMP/manifest.json"
          jq -e '[.manifests[].platform | select(.os != "unknown") | (.os + "/" + .architecture)] | sort == ["linux/amd64", "linux/arm64"]' "$RUNNER_TEMP/manifest.json"
          docker buildx imagetools create --tag "$IMAGE_TAG" "${images[@]}"
          docker buildx imagetools inspect "$IMAGE_TAG" --format '{{json .Manifest}}' > "$RUNNER_TEMP/published.json"
          jq -e '[.manifests[].platform | select(.os != "unknown") | (.os + "/" + .architecture)] | sort == ["linux/amd64", "linux/arm64"]' "$RUNNER_TEMP/published.json"
          image_digest=$(jq -er '.digest' "$RUNNER_TEMP/published.json")
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo '### Docker Hub: erquren/ergent'
            echo 'Platforms: linux/amd64, linux/arm64'
            echo '```text'
            printf '%s\n' "$IMAGE_TAG"
            printf 'docker.io/erquren/ergent@%s\n' "$image_digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
