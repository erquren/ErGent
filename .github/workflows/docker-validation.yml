name: Docker validation

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  docker:
    name: Docker Linux ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Docker helpers and version tags without Docker
        run: python -m unittest discover -s scripts/tests -p 'test_docker*.py' -v
      - name: Validate all standalone deployment configurations
        env:
          ERGENT_ORIGIN: https://ergent.example.invalid
          ERGENT_CERT_DIR: /tmp
          ERGENT_TRUSTED_PROXY: 192.0.2.2
          ERGENT_PROXY_NETWORK: ergent-smoke-proxy
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f deploy/compose.host-proxy.yaml config --quiet
          docker compose -f deploy/compose.container-proxy.yaml config --quiet
          docker compose -f deploy/compose.dev-http.yaml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and load server image on native architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          tags: ergent-server:smoke
          load: true
          push: false
          cache-from: type=gha,scope=docker-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.architecture }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2
        with:
          key: docker-native-agent-${{ matrix.architecture }}
      - name: Build native Agent for actual HTTPS and WSS integration
        run: cargo build --locked -p ergent-client
      - name: Test direct TLS, optional proxy, dev HTTP, and native Agent
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python scripts/test-docker.py --image ergent-server:smoke --architecture "$ARCHITECTURE" --agent-binary target/debug/ergent-client
      # No registry login, push, release upload, or secret-bearing artifacts.
