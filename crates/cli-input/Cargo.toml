[package]
name = "ergent-cli-input"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Level-triggered Unix polling also handles a paste larger than one 1 KiB read.
# All terminal APIs are gated on stdin.is_terminal() in the library.
crossterm = { version = "0.29", default-features = false, features = ["events", "windows", "use-dev-tty"] }
zeroize = "1"

[dev-dependencies]
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["term"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
